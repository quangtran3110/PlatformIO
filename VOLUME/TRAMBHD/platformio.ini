; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_port = COM7
upload_speed = 115200
; Work around CH340 driver error 31 in the Python/pySerial uploader on this PC.
upload_protocol = custom
upload_command = "${platformio.packages_dir}/tool-esptool/esptool.exe" -vv -cd nodemcu -cb $UPLOAD_SPEED -cp $UPLOAD_PORT -ca 0x00000000 -cf "$SOURCE"
monitor_port = COM7
monitor_speed = 115200
board_build.f_cpu = 160000000L
lib_extra_dirs = ../../lib
